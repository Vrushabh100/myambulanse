<title>MyAmbulance Loader</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: one centered loader. A 3D vehicle drives an open arc of road around a medical globe.
     The road is split in two: on part 1 it is a car, in the gap it passes the transform gate,
     on part 2 it comes out as an ambulance. All brand colours live in the variables below. */
  :root {
    --bg: #F3FBF8;
    --ink: #0B2B2E;
    --muted: #547378;
    --brand: #0FBFA8;
    --brand-2: #0A8F7F;
    --accent: #FFC233;
    --siren: #FF3B4E;
    --road: #26383D;
    --road-edge: #4F7A80;
    --dash: #F3FBF8;
    --globe-1: #E4FAF4;
    --globe-2: #6FD3C0;
    --land: rgba(0, 150, 130, 0.2);
    --globe-line: rgba(11, 43, 46, 0.16);
    --globe-cross: rgba(255, 255, 255, 0.9);
    --halo: rgba(20, 209, 180, 0.26);
    --shadow: rgba(11, 43, 46, 0.34);
    --car-body: #FF7A59;
    --car-dark: #E0553A;
    --amb-body: #FFFFFF;
    --amb-cab: #E6F4F1;
    --amb-trim: #FF3B4E;
    --font-display: "Outfit", "Segoe UI", system-ui, sans-serif;
    --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #071A1C;
      --ink: #EAFBF8;
      --muted: #8FB3B0;
      --road: #2F4348;
      --road-edge: #5E8A90;
      --dash: #D8F3EE;
      --globe-1: #2AA89A;
      --globe-2: #0C3B3F;
      --land: rgba(200, 255, 245, 0.16);
      --globe-line: rgba(220, 255, 250, 0.16);
      --globe-cross: rgba(255, 255, 255, 0.6);
      --halo: rgba(20, 209, 180, 0.3);
      --shadow: rgba(0, 0, 0, 0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #071A1C;
    --ink: #EAFBF8;
    --muted: #8FB3B0;
    --road: #2F4348;
    --road-edge: #5E8A90;
    --dash: #D8F3EE;
    --globe-1: #2AA89A;
    --globe-2: #0C3B3F;
    --land: rgba(200, 255, 245, 0.16);
    --globe-line: rgba(220, 255, 250, 0.16);
    --globe-cross: rgba(255, 255, 255, 0.6);
    --halo: rgba(20, 209, 180, 0.3);
    --shadow: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }

  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; }
  body {
    box-sizing: border-box;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    display: grid;
    place-items: center;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .loader {
    width: 100%;
    max-width: 460px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(26px, 6vw, 34px);
    letter-spacing: -0.01em;
    text-wrap: balance;
    text-align: center;
  }
  .dots i {
    display: inline-block;
    width: 0.2em;
    height: 0.2em;
    margin-left: 0.12em;
    border-radius: 50%;
    background: var(--brand);
    animation: dot 1.2s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: 0.18s; }
  .dots i:nth-child(3) { animation-delay: 0.36s; }
  @keyframes dot {
    0%, 70%, 100% { opacity: 0.25; transform: translateY(0); }
    35% { opacity: 1; transform: translateY(-0.18em); }
  }
  .sub { margin: 0; font-size: 15px; color: var(--muted); text-align: center; }

  /* Scene: stacked layers so the ambulance can pass behind and in front of the globe */
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 480 / 190;
    transform: rotate(-8deg);
    margin-bottom: 6px;
  }
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; display: block; }
  .l-back { z-index: 1; }
  .l-globe { z-index: 3; }
  .l-front { z-index: 4; }
  .road { fill: var(--road); }
  .edge { fill: none; stroke: var(--road-edge); stroke-width: 1.3; stroke-linejoin: round; }
  .dash { fill: var(--dash); opacity: 0.85; }
  .grid { fill: none; stroke: var(--globe-line); stroke-width: 1.5; }
  .land { fill: var(--land); }
  .cross { fill: var(--globe-cross); }
  .cap { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; }
  .pad { fill: var(--accent); opacity: 0.2; }
  .grp { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
  .fx { position: absolute; left: 0; top: -28px; width: 0; height: 0; pointer-events: none; }
  .ring { position: absolute; left: -45px; top: -45px; width: 90px; height: 90px; box-sizing: border-box; border-radius: 50%; border: 3px solid var(--accent); opacity: 0; }
  .ring.r2 { border-color: var(--siren); }
  .sp { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px 2px var(--accent); opacity: 0; }
  .sp:nth-child(3n) { background: var(--siren); box-shadow: 0 0 8px 2px var(--siren); }
  .sp:nth-child(3n+1) { background: #fff; box-shadow: 0 0 8px 2px var(--brand); }

  /* Ambulance (3D) */
  .amb { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 2; transform-origin: 0 0; }
  .shadow {
    position: absolute; left: 0; top: 0;
    background: var(--shadow);
    border-radius: 50%;
    filter: blur(3px);
  }
  .persp { position: absolute; left: 0; top: 0; width: 0; height: 0; perspective: 520px; perspective-origin: 0 -26px; }
  .rig { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
  .p { position: absolute; left: 0; top: 0; transform-origin: 0 0; backface-visibility: hidden; }
  .p::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: #0B1F22; opacity: var(--sh, 0); pointer-events: none;
  }
  .p.noov::after { display: none; }
  .p svg { display: block; }
  .p .sh { fill: #0B1F22; fill-opacity: var(--sh, 0); }
  .roofc { background: var(--amb-body); }
  .roofl { background: var(--amb-cab); }
  .hood { background: var(--amb-cab); }
  .step { background: var(--amb-trim); }
  .croof, .chood { background: var(--car-body); }
  .k1 { fill: var(--amb-body); } .k2 { fill: var(--amb-cab); } .k3 { fill: var(--amb-trim); } .kg { fill: #8ED2FF; }
  .c1 { fill: var(--car-body); } .c2 { fill: var(--car-dark); }
  .glass { background: linear-gradient(140deg, #C4EBFF 0%, #7CC3F5 55%, #5AA9E6 100%); }
  .tire { background: #142226; border-radius: 50%; backface-visibility: visible; }
  .rim {
    border-radius: 50%;
    background: radial-gradient(circle, var(--brand-2) 0 18%, #D7EFEA 20% 62%, #142226 64% 100%);
  }
  .hub {
    position: absolute; inset: 1px; border-radius: 50%;
    background:
      linear-gradient(var(--brand-2), var(--brand-2)) center / 100% 1.6px no-repeat,
      linear-gradient(var(--brand-2), var(--brand-2)) center / 1.6px 100% no-repeat;
    animation: spin 0.45s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .lt { backface-visibility: visible; }
  .lr { background: #FF2D55; animation: fa 0.5s steps(1, end) infinite; }
  .lb { background: #2D8CFF; animation: fb 0.5s steps(1, end) infinite; }
  @keyframes fa { 0% { opacity: 1; box-shadow: 0 0 9px 3px rgba(255, 45, 85, 0.85); } 50% { opacity: 0.3; box-shadow: none; } }
  @keyframes fb { 0% { opacity: 0.3; box-shadow: none; } 50% { opacity: 1; box-shadow: 0 0 9px 3px rgba(45, 140, 255, 0.85); } }

  /* Globe: ocean + sliding continents + heartbeat line */
  :root { --ocean-1: #3FF0CF; --ocean-2: #0CA9B3; --ocean-3: #085A78; --land-1: #F2FFF9; --land-2: #9DF0D5; --atmo: #8FFFE3; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ocean-1: #25C9B0; --ocean-2: #0A7F92; --ocean-3: #053A55; --land-1: #CFFBEA; --land-2: #5FD9B8; }
  }
  :root[data-theme="dark"] { --ocean-1: #25C9B0; --ocean-2: #0A7F92; --ocean-3: #053A55; --land-1: #CFFBEA; --land-2: #5FD9B8; }
  .ld { fill: url(#landFill); stroke: rgba(255, 255, 255, 0.55); stroke-width: 0.8; }
  .gridl { fill: none; stroke: rgba(255, 255, 255, 0.16); stroke-width: 1; }
  .pin circle { fill: var(--accent); }
  .pin .rip { fill: none; stroke: var(--accent); stroke-width: 1.2; transform-box: fill-box; transform-origin: center; animation: rip 2s ease-out infinite; }
  .ecg0 { fill: none; stroke: rgba(255, 255, 255, 0.35); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ecg1 { fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 26 100; filter: drop-shadow(0 0 3px #fff); animation: ecg 2.2s linear infinite; }
  .atmo { fill: none; stroke: var(--atmo); stroke-width: 2.5; opacity: 0.6; animation: breathe 3.6s ease-in-out infinite; }
  .halo { transform-box: fill-box; transform-origin: center; animation: pulse 3.6s ease-in-out infinite; }
  .drift { animation: drift 26s linear infinite; }
  .tw { fill: var(--accent); transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
  .tw.t2 { fill: #fff; animation-delay: 0.8s; }
  .tw.t3 { animation-delay: 1.5s; }
  @keyframes drift { to { transform: translateX(-288px); } }
  @keyframes rip { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(4.5); opacity: 0; } }
  @keyframes ecg { from { stroke-dashoffset: 26; } to { stroke-dashoffset: -100; } }
  @keyframes breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.06); opacity: 1; } }
  @keyframes twinkle { 0%, 100% { transform: scale(0.4); opacity: 0.3; } 50% { transform: scale(1.1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .drift, .rip, .ecg1, .atmo, .halo, .tw { animation: none; }
    .ecg1 { stroke-dasharray: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hub, .lr, .lb { animation: none; }
    .dots i { animation: none; opacity: 0.7; }
  }
</style>

<main class="loader">
  <div class="stage" id="stage" aria-hidden="true">
    <!-- back half of the road, behind the globe -->
    <svg class="layer l-back" viewBox="0 48 480 190" focusable="false">
      <path id="bRoad" class="road"/>
      <path id="bEdgeO" class="edge"/>
      <path id="bEdgeI" class="edge"/>
      <path id="bDash" class="dash"/>
    </svg>

    <!-- ambulance; its stacking position switches between behind and in front of the globe -->
    <div class="amb" id="amb">
      <div class="shadow" id="shadow"></div>
      <div class="persp"><div class="rig" id="rig"></div></div>
      <div class="fx" id="fx"><i class="ring"></i><i class="ring r2"></i><i class="sp"></i><i class="sp"></i><i class="sp"></i><i class="sp"></i><i class="sp"></i><i class="sp"></i></div>
    </div>

    <!-- globe -->
    <svg class="layer l-globe" viewBox="0 48 480 190" focusable="false">
      <defs>
        <radialGradient id="halo" cx="50%" cy="50%" r="50%">
          <stop offset="0.62" stop-color="var(--halo)"/>
          <stop offset="1" stop-color="var(--halo)" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="ocean" cx="34%" cy="28%" r="85%">
          <stop offset="0" stop-color="var(--ocean-1)"/>
          <stop offset="0.55" stop-color="var(--ocean-2)"/>
          <stop offset="1" stop-color="var(--ocean-3)"/>
        </radialGradient>
        <linearGradient id="landFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--land-1)"/>
          <stop offset="1" stop-color="var(--land-2)"/>
        </linearGradient>
        <radialGradient id="shade" cx="32%" cy="26%" r="95%">
          <stop offset="0.45" stop-color="#021B2A" stop-opacity="0"/>
          <stop offset="1" stop-color="#021B2A" stop-opacity="0.55"/>
        </radialGradient>
        <radialGradient id="rim" cx="50%" cy="50%" r="50%">
          <stop offset="0.9" stop-color="#9FFFE6" stop-opacity="0"/>
          <stop offset="1" stop-color="#9FFFE6" stop-opacity="0.75"/>
        </radialGradient>
        <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#021B2A" stop-opacity="0.6"/>
          <stop offset="0.3" stop-color="#021B2A" stop-opacity="0"/>
          <stop offset="0.7" stop-color="#021B2A" stop-opacity="0"/>
          <stop offset="1" stop-color="#021B2A" stop-opacity="0.6"/>
        </linearGradient>
        <clipPath id="cGlobe"><circle cx="240" cy="140" r="72"/></clipPath>
      </defs>

      <circle class="halo" cx="240" cy="140" r="98" fill="url(#halo)"/>
      <circle cx="240" cy="140" r="72" fill="url(#ocean)"/>

      <g clip-path="url(#cGlobe)">
        <!-- continents slide sideways in a seamless loop, so the planet turns -->
        <g class="drift">
          <g id="lands">
            <path class="ld" d="M182,96 C192,80 220,76 236,86 C252,94 250,108 240,116 C246,128 232,140 218,138 C210,150 196,152 190,140 C184,130 190,122 184,114 C178,108 178,102 182,96Z"/>
            <path class="ld" d="M278,100 C292,92 312,96 322,108 C332,120 322,132 310,134 C316,146 304,160 292,156 C282,150 286,140 278,134 C268,126 266,108 278,100Z"/>
            <path class="ld" d="M214,170 C228,162 248,166 256,178 C262,190 246,200 232,198 C218,196 206,182 214,170Z"/>
            <path class="ld" d="M340,160 C352,152 372,156 376,170 C380,184 362,194 350,190 C338,184 332,170 340,160Z"/>
            <path class="ld" d="M396,92 C410,84 430,90 434,104 C438,118 420,124 408,120 C394,114 388,100 396,92Z"/>
            <ellipse class="ld" cx="262" cy="150" rx="8" ry="5"/>
            <ellipse class="ld" cx="300" cy="184" rx="10" ry="6"/>
            <ellipse class="ld" cx="388" cy="150" rx="9" ry="5"/>
            <ellipse class="ld" cx="330" cy="82" rx="8" ry="4"/>
            <g class="pin"><circle class="rip" cx="232" cy="108" r="3"/><circle cx="232" cy="108" r="2.6"/></g>
            <g class="pin"><circle class="rip" cx="300" cy="118" r="3" style="animation-delay:.7s"/><circle cx="300" cy="118" r="2.6"/></g>
            <g class="pin"><circle class="rip" cx="360" cy="172" r="3" style="animation-delay:1.3s"/><circle cx="360" cy="172" r="2.6"/></g>
            <g class="pin"><circle class="rip" cx="416" cy="104" r="3" style="animation-delay:.3s"/><circle cx="416" cy="104" r="2.6"/></g>
          </g>
          <use href="#lands" x="288"/>
        </g>
        <g class="gridl">
          <path d="M177.6,104 Q240,120 302.4,104"/>
          <path d="M168,140 Q240,154 312,140"/>
          <path d="M177.6,176 Q240,190 302.4,176"/>
          <ellipse cx="240" cy="140" rx="34" ry="72"/>
        </g>
        <rect x="168" y="68" width="144" height="144" fill="url(#edge)"/>
        <!-- heartbeat line across the planet -->
        <path class="ecg0" d="M170,140 L198,140 L208,140 L214,126 L222,160 L230,108 L238,152 L244,140 L252,140 L258,134 L264,140 L310,140"/>
        <path class="ecg1" pathLength="100" d="M170,140 L198,140 L208,140 L214,126 L222,160 L230,108 L238,152 L244,140 L252,140 L258,134 L264,140 L310,140"/>
      </g>

      <circle cx="240" cy="140" r="72" fill="url(#shade)"/>
      <circle cx="240" cy="140" r="72" fill="url(#rim)"/>
      <circle class="atmo" cx="240" cy="140" r="73.5"/>
      <ellipse cx="208" cy="96" rx="24" ry="11" fill="#fff" opacity="0.2" transform="rotate(-32 208 96)"/>
      <ellipse cx="204" cy="92" rx="10" ry="4.5" fill="#fff" opacity="0.5" transform="rotate(-32 204 92)"/>

      <g transform="translate(176,60)"><path class="tw" d="M0,-6 L1.6,-1.6 L6,0 L1.6,1.6 L0,6 L-1.6,1.6 L-6,0 L-1.6,-1.6Z"/></g>
      <g transform="translate(314,58)"><path class="tw t2" d="M0,-6 L1.6,-1.6 L6,0 L1.6,1.6 L0,6 L-1.6,1.6 L-6,0 L-1.6,-1.6Z"/></g>
      <g transform="translate(348,108)"><path class="tw t3" d="M0,-5 L1.3,-1.3 L5,0 L1.3,1.3 L0,5 L-1.3,1.3 L-5,0 L-1.3,-1.3Z"/></g>
    </svg>

    <!-- front half of the road, in front of the globe -->
    <svg class="layer l-front" viewBox="0 48 480 190" focusable="false">
      <path id="pad" class="pad"/>
      <path id="fRoad" class="road"/>
      <path id="fEdgeO" class="edge"/>
      <path id="fEdgeI" class="edge"/>
      <path id="gRoad" class="road"/>
      <path id="gEdgeO" class="edge"/>
      <path id="gEdgeI" class="edge"/>
      <path id="fDash" class="dash"/>
      <path id="caps" class="cap"/>
    </svg>
  </div>

  <h1 class="title">MyAmbulance<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></h1>
  <p class="sub" role="status">Checking your session</p>
</main>

<script>
(function () {
  var FROZEN = null; // a number 0..1 pins the animation for testing; null runs it

  /* ---------- scene geometry ---------- */
  var CX = 240, CY = 140, RX = 190, RY = 64, K = RY / RX;
  var T0 = Math.PI + 0.08;          // arc starts hidden behind the globe, back left
  var T1 = 2 * Math.PI + 0.5;       // arc ends at the front right, open, not joined to the start
  var TM = 1.5 * Math.PI;           // left-most point: the road passes from behind to in front of the globe
  var TS = TM + 0.55;               // middle of the split: the car turns into the ambulance here
  var GAP = 0.07;                   // half-width of the gap between the two road parts (radians)

  function smooth(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }
  function F(t) { return (Math.cos(t) + 1) / 2; }
  function half(t) {
    var u = (t - T0) / (T1 - T0);
    var taper = 0.18 + 0.82 * Math.min(smooth(u / 0.09), smooth((1 - u) / 0.14));
    return (3.5 + 16 * Math.pow(F(t), 1.15)) * taper;
  }
  function P(t, w) { return [CX + (RX + w) * Math.sin(t), CY + (RY + w * K) * Math.cos(t)]; }
  function pts(a) { return a.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join('L'); }

  function buildRoad(ta, tb, ids) {
    var n = 48, o = [], i = [];
    for (var k = 0; k <= n; k++) {
      var t = ta + (tb - ta) * k / n, w = half(t);
      o.push(P(t, w)); i.push(P(t, -w));
    }
    document.getElementById(ids[0]).setAttribute('d', 'M' + pts(o) + 'L' + pts(i.slice().reverse()) + 'Z');
    document.getElementById(ids[1]).setAttribute('d', 'M' + pts(o));
    document.getElementById(ids[2]).setAttribute('d', 'M' + pts(i));
  }
  buildRoad(T0, TM, ['bRoad', 'bEdgeO', 'bEdgeI']);           // part 1 (car), behind the globe
  buildRoad(TM, TS - GAP, ['fRoad', 'fEdgeO', 'fEdgeI']);     // part 1 (car), in front of the globe
  buildRoad(TS + GAP, T1, ['gRoad', 'gEdgeO', 'gEdgeI']);     // part 2 (ambulance)

  // transform gate: a glowing pad in the gap plus amber caps on both road ends
  var wa = half(TS - GAP), wb = half(TS + GAP);
  document.getElementById('pad').setAttribute('d', 'M' + pts([P(TS - GAP, wa), P(TS + GAP, wb), P(TS + GAP, -wb), P(TS - GAP, -wa)]) + 'Z');
  document.getElementById('caps').setAttribute('d',
    'M' + pts([P(TS - GAP, wa), P(TS - GAP, -wa)]) + 'M' + pts([P(TS + GAP, wb), P(TS + GAP, -wb)]));

  var dB = '', dF = '';
  for (var t = T0 + 0.17; t + 0.06 < T1 - 0.12; t += 0.12) {
    if (t + 0.06 > TS - GAP - 0.02 && t < TS + GAP + 0.02) continue;   // no dashes inside the gap
    var dw = 0.5 + 1.2 * F(t);
    var q = 'M' + pts([P(t, dw), P(t + 0.06, dw), P(t + 0.06, -dw), P(t, -dw)]) + 'Z';
    if (Math.cos(t) < 0) dB += q; else dF += q;
  }
  document.getElementById('bDash').setAttribute('d', dB);
  document.getElementById('fDash').setAttribute('d', dF);

  /* ---------- 3D ambulance (model units: x forward, y down, z toward viewer; ground at y = 0) ---------- */
  var rig = document.getElementById('rig');
  var shaded = [], cur = rig;
  var gCar = document.createElement('div'), gAmb = document.createElement('div');
  gCar.className = gAmb.className = 'grp';
  rig.appendChild(gCar); rig.appendChild(gAmb);

  function plane(o) {
    var el = document.createElement('div');
    el.className = 'p ' + (o.cls || '');
    el.style.width = o.w + 'px';
    el.style.height = o.h + 'px';
    el.style.transform = 'translate3d(' + o.x + 'px,' + o.y + 'px,' + o.z + 'px) ' + (o.r || '') +
      ' translate(' + (-o.w / 2) + 'px,' + (-o.h / 2) + 'px)';
    if (o.html) el.innerHTML = o.html;
    if (o.n) shaded.push({ el: el, n: o.n });
    cur.appendChild(el);
    return el;
  }
  function box(cx, cy, cz, w, h, d, cls) {
    plane({ w: w, h: d, x: cx, y: cy - h / 2, z: cz, r: 'rotateX(90deg)', cls: cls, n: [0, -1, 0] });
    plane({ w: w, h: h, x: cx, y: cy, z: cz + d / 2, cls: cls, n: [0, 0, 1] });
    plane({ w: w, h: h, x: cx, y: cy, z: cz - d / 2, r: 'rotateY(180deg)', cls: cls, n: [0, 0, -1] });
    plane({ w: d, h: h, x: cx + w / 2, y: cy, z: cz, r: 'rotateY(90deg)', cls: cls, n: [1, 0, 0] });
    plane({ w: d, h: h, x: cx - w / 2, y: cy, z: cz, r: 'rotateY(-90deg)', cls: cls, n: [-1, 0, 0] });
  }

  // textures: class-coloured SVG, so every colour comes from the CSS variables at the top
  function mirror(inner, flip) {
    return '<svg viewBox="-50 -50 102 40" width="102" height="40"><g' + (flip ? ' transform="translate(2,0) scale(-1,1)"' : '') + '>' + inner + '</g></svg>';
  }
  function ambSide(flip) {
    return mirror(
      '<polygon class="k1" points="-50,-10 -50,-50 10,-50 10,-10"/>' +
      '<polygon class="k2" points="10,-10 10,-40 22,-40 36,-24 52,-22 52,-10"/>' +
      '<rect class="k3" x="-50" y="-23" width="60" height="4"/>' +
      '<polygon class="kg" points="13.5,-37.5 21,-37.5 31,-26 13.5,-26"/>' +
      '<line x1="-6" y1="-47" x2="-6" y2="-14" stroke="#B5D0CB" stroke-width=".8"/>' +
      '<rect x="-50" y="-16" width="102" height="6" fill="#CFE3DE"/>' +
      '<circle cx="-30" cy="-9" r="11" fill="#1B2B2F"/><circle cx="34" cy="-9" r="11" fill="#1B2B2F"/>' +
      '<rect class="k3" x="-23" y="-46" width="6" height="20"/><rect class="k3" x="-30" y="-39" width="20" height="6"/>' +
      '<polygon class="sh" points="-50,-10 -50,-50 10,-50 10,-40 22,-40 36,-24 52,-22 52,-10"/>', flip);
  }
  function carSide(flip) {
    return mirror(
      '<polygon class="c1" points="-48,-10 -48,-27 -44,-27 -34,-42 10,-42 28,-27 50,-25 50,-10"/>' +
      '<polygon class="kg" points="-41,-28 -33,-39.5 -9,-39.5 -9,-28"/>' +
      '<polygon class="kg" points="-5,-28 -5,-39.5 9,-39.5 21,-28"/>' +
      '<line x1="-7" y1="-27" x2="-7" y2="-12" style="stroke:var(--car-dark)" stroke-width=".8"/>' +
      '<rect class="c2" x="-48" y="-14" width="98" height="4"/>' +
      '<rect x="-3" y="-24" width="6" height="1.6" rx=".8" fill="#fff" opacity=".8"/>' +
      '<circle cx="-28" cy="-9" r="11" fill="#1B2B2F"/><circle cx="32" cy="-9" r="11" fill="#1B2B2F"/>' +
      '<polygon class="sh" points="-48,-10 -48,-27 -44,-27 -34,-42 10,-42 28,-27 50,-25 50,-10"/>', flip);
  }
  var ambRear = '<svg viewBox="0 0 44 40" width="44" height="40">' +
    '<rect class="k1" width="44" height="40"/>' +
    '<rect class="kg" x="4" y="4" width="15" height="9" rx="1.5"/><rect class="kg" x="25" y="4" width="15" height="9" rx="1.5"/>' +
    '<rect class="k3" x="19.5" y="15" width="5" height="18"/><rect class="k3" x="13" y="21.5" width="18" height="5"/>' +
    '<line x1="22" y1="2" x2="22" y2="34" stroke="#B5D0CB" stroke-width=".8"/>' +
    '<rect y="34" width="44" height="6" fill="#CFE3DE"/>' +
    '<rect x="2" y="35.5" width="6" height="3" rx="1" fill="#FF2D55"/><rect x="36" y="35.5" width="6" height="3" rx="1" fill="#FF2D55"/>' +
    '</svg>';
  var ambFront = '<svg viewBox="0 0 44 12" width="44" height="12">' +
    '<rect class="k2" width="44" height="12"/><rect y="8" width="44" height="4" fill="#CFE3DE"/>' +
    '<rect x="15" y="2" width="14" height="4" rx="1" fill="#1B2B2F"/>' +
    '<circle cx="7" cy="4.5" r="2.6" fill="#FFD76A"/><circle cx="37" cy="4.5" r="2.6" fill="#FFD76A"/>' +
    '</svg>';
  var carRear = '<svg viewBox="0 0 38 17" width="38" height="17">' +
    '<rect class="c1" width="38" height="17"/>' +
    '<rect x="2" y="3" width="8" height="4" rx="1" fill="#FF2D55"/><rect x="28" y="3" width="8" height="4" rx="1" fill="#FF2D55"/>' +
    '<rect x="13" y="8" width="12" height="5" rx="1" fill="#fff" opacity=".9"/><rect class="c2" y="13" width="38" height="4"/>' +
    '</svg>';
  var carFront = '<svg viewBox="0 0 38 15" width="38" height="15">' +
    '<rect class="c1" width="38" height="15"/><rect x="12" y="6" width="14" height="4" rx="1" fill="#1B2B2F"/>' +
    '<circle cx="6" cy="5" r="2.8" fill="#FFD76A"/><circle cx="32" cy="5" r="2.8" fill="#FFD76A"/>' +
    '<rect class="c2" y="11" width="38" height="4"/>' +
    '</svg>';
  var roofCross = '<svg viewBox="0 0 60 44" width="60" height="44"><rect class="k3" x="26" y="8" width="8" height="28"/><rect class="k3" x="16" y="18" width="28" height="8"/></svg>';

  function wheels(xs, zs, zr) {
    xs.forEach(function (wx) {
      [1, -1].forEach(function (sg) {
        zs.forEach(function (zz) { plane({ w: 18, h: 18, x: wx, y: -9, z: sg * zz, cls: 'tire' }); });
        plane({ w: 18, h: 18, x: wx, y: -9, z: sg * zr, r: sg < 0 ? 'rotateY(180deg)' : '',
          cls: 'rim', html: '<i class="hub"></i>', n: [0, 0, sg] });
      });
    });
  }

  // ambulance (part 2)
  cur = gAmb;
  plane({ w: 102, h: 40, x: 1, y: -30, z: 22, cls: 'noov', html: ambSide(false), n: [0, 0, 1] });
  plane({ w: 102, h: 40, x: 1, y: -30, z: -22, r: 'rotateY(180deg)', cls: 'noov', html: ambSide(true), n: [0, 0, -1] });
  plane({ w: 60, h: 44, x: -20, y: -50, z: 0, r: 'rotateX(90deg)', cls: 'roofc noov', html: roofCross, n: [0, -1, 0] });
  plane({ w: 12, h: 44, x: 16, y: -40, z: 0, r: 'rotateX(90deg)', cls: 'roofl', n: [0, -1, 0] });
  plane({ w: 21.3, h: 44, x: 29, y: -32, z: 0, r: 'rotateZ(48.8deg) rotateX(90deg)', cls: 'glass', n: [0.75, -0.66, 0] });
  plane({ w: 16.1, h: 44, x: 44, y: -23, z: 0, r: 'rotateZ(7deg) rotateX(90deg)', cls: 'hood', n: [0.12, -0.99, 0] });
  plane({ w: 44, h: 12, x: 52, y: -16, z: 0, r: 'rotateY(90deg)', cls: 'noov', html: ambFront, n: [1, 0, 0] });
  plane({ w: 44, h: 10, x: 10, y: -45, z: 0, r: 'rotateY(90deg)', cls: 'step', n: [1, 0, 0] });
  plane({ w: 44, h: 40, x: -50, y: -30, z: 0, r: 'rotateY(-90deg)', html: ambRear, n: [-1, 0, 0] });
  box(-6, -53, -9.5, 8, 6, 17, 'lt lr');
  box(-6, -53, 9.5, 8, 6, 17, 'lt lb');
  wheels([-30, 34], [16, 18, 20, 22], 22.7);

  // car (part 1)
  cur = gCar;
  plane({ w: 102, h: 40, x: 1, y: -30, z: 19, cls: 'noov', html: carSide(false), n: [0, 0, 1] });
  plane({ w: 102, h: 40, x: 1, y: -30, z: -19, r: 'rotateY(180deg)', cls: 'noov', html: carSide(true), n: [0, 0, -1] });
  plane({ w: 44, h: 38, x: -12, y: -42, z: 0, r: 'rotateX(90deg)', cls: 'croof', n: [0, -1, 0] });
  plane({ w: 23.4, h: 38, x: 19, y: -34.5, z: 0, r: 'rotateZ(39.8deg) rotateX(90deg)', cls: 'glass', n: [0.64, -0.77, 0] });
  plane({ w: 22.1, h: 38, x: 39, y: -26, z: 0, r: 'rotateZ(5.2deg) rotateX(90deg)', cls: 'chood', n: [0.09, -1, 0] });
  plane({ w: 18, h: 38, x: -39, y: -34.5, z: 0, r: 'rotateZ(-56.3deg) rotateX(90deg)', cls: 'glass', n: [-0.83, -0.55, 0] });
  plane({ w: 38, h: 15, x: 50, y: -17.5, z: 0, r: 'rotateY(90deg)', cls: 'noov', html: carFront, n: [1, 0, 0] });
  plane({ w: 38, h: 17, x: -48, y: -18.5, z: 0, r: 'rotateY(-90deg)', html: carRear, n: [-1, 0, 0] });
  wheels([-28, 32], [13, 15, 17, 19], 19.7);

  var LX = -0.415, LY = -0.784, LZ = 0.461; // light direction in the scene (from upper left, toward the viewer)
  function shade(a) {
    var c = Math.cos(a), s = Math.sin(a);
    for (var i = 0; i < shaded.length; i++) {
      var n = shaded[i].n;
      var nx = n[0] * c + n[2] * s, nz = -n[0] * s + n[2] * c;
      var lam = Math.max(0, nx * LX + n[1] * LY + nz * LZ);
      shaded[i].el.style.setProperty('--sh', (0.42 * (1 - lam)).toFixed(3));
    }
  }

  /* ---------- animation ---------- */
  var stage = document.getElementById('stage');
  var amb = document.getElementById('amb');
  var shadow = document.getElementById('shadow');
  var pad = document.getElementById('pad');
  var rings = document.querySelectorAll('#fx .ring'), sparks = document.querySelectorAll('#fx .sp');
  var TRAVEL = 3.6, REST = 0.45;

  function ease(u) { return 0.55 * u + 0.45 * (1 - (1 - u) * (1 - u)); }   // quick start, soft arrival
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  // progress at which the vehicle reaches the middle of the gap
  var uS = (function () {
    var lo = 0, hi = 1;
    for (var i = 0; i < 30; i++) {
      var mid = (lo + hi) / 2;
      if (T0 + (T1 - T0) * ease(mid) < TS) lo = mid; else hi = mid;
    }
    return lo;
  })();

  function render(u) {
    var t = T0 + (T1 - T0) * ease(u);
    var d = Math.cos(t), f = (d + 1) / 2;
    var x = CX + RX * Math.sin(t), y = CY + RY * d;
    var s = 0.28 + 0.66 * Math.pow(f, 1.35);               // small behind, big in front
    var vis = Math.min(smooth(u / 0.06), smooth((1 - u) / 0.05));
    var o = (0.6 + 0.4 * Math.pow(f, 0.6)) * vis;
    var k = stage.clientWidth / 480;

    // transform moment: car before the gap middle, ambulance after it, with a pop and a burst on the swap
    var isAmb = u >= uS;
    gCar.style.display = isAmb ? 'none' : '';
    gAmb.style.display = isAmb ? '' : 'none';
    var pop = 1 + 0.18 * Math.sin(Math.PI * clamp01((u - (uS - 0.05)) / 0.1));
    var b = clamp01((u - (uS - 0.01)) / 0.16), live = b > 0 && b < 1;
    var b2 = clamp01((b - 0.2) / 0.8);
    rings[0].style.opacity = live ? ((1 - b) * 0.9).toFixed(3) : 0;
    rings[0].style.transform = 'scale(' + (0.25 + 1.6 * b).toFixed(3) + ')';
    rings[1].style.opacity = live ? ((1 - b2) * 0.9).toFixed(3) : 0;
    rings[1].style.transform = 'scale(' + (0.2 + 1.9 * b2).toFixed(3) + ')';
    for (var i = 0; i < sparks.length; i++) {
      var a = i / sparks.length * 2 * Math.PI + 0.5, r = 18 + 62 * b;
      sparks[i].style.opacity = live ? (1 - b).toFixed(3) : 0;
      sparks[i].style.transform = 'translate(' + (Math.cos(a) * r).toFixed(1) + 'px,' + (Math.sin(a) * r * 0.8).toFixed(1) + 'px) scale(' + (1 - 0.5 * b).toFixed(2) + ')';
    }
    pad.style.opacity = (0.18 + 0.7 * Math.max(0, 1 - Math.abs(u - uS) / 0.16)).toFixed(3);

    amb.style.transform = 'translate(' + (x * k).toFixed(2) + 'px,' + ((y - 48) * k).toFixed(2) + 'px) scale(' + (s * pop * k).toFixed(4) + ')';
    amb.style.opacity = o.toFixed(3);
    amb.style.zIndex = d >= 0 ? 5 : 2;
    rig.style.transform = 'rotateX(-20deg) rotateY(' + (t * 180 / Math.PI).toFixed(2) + 'deg)';

    var ca = Math.abs(Math.cos(t)), sa = Math.abs(Math.sin(t));
    var sw = 100 * ca + 46 * sa + 14, sh = (46 * ca + 100 * sa) * 0.34 + 9;
    shadow.style.width = sw.toFixed(1) + 'px';
    shadow.style.height = sh.toFixed(1) + 'px';
    shadow.style.transform = 'translate(' + (1 - sw / 2).toFixed(1) + 'px,' + (-sh / 2 + 1).toFixed(1) + 'px)';
    shade(t);
  }

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (FROZEN !== null || reduce) {
    render(FROZEN !== null ? FROZEN : 0.78);
    return;
  }
  var start = null;
  function frame(now) {
    if (start === null) start = now;
    var sec = ((now - start) / 1000) % (TRAVEL + REST);
    render(Math.min(1, sec / TRAVEL));
    requestAnimationFrame(frame);
  }
  render(0.6);
  requestAnimationFrame(frame);
})();
</script>
